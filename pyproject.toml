[project]
name = "sec-financials-api"
version = "0.1.0"
description = "Normalized SEC financial data (Track 1: structured numeric data) as a JSON API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # tests/test_compose_shape.py parses the compose files rather than grepping them. In the dev
    # extra so those guards RUN in a normal test pass -- they use importorskip, and a guard that
    # silently skips is not a guard.
    "pyyaml>=6.0",
]
# Milestone 2.5 batch/analytical jobs ONLY (13F cross-manager inversion, later
# cross-company screening) -- never a runtime dependency of the live API. Pinned
# exactly, not a range: see docs/ARCHITECTURE.md 3b for the benchmark + concurrency
# verification this version was chosen against ("verify, don't assume" -- CLAUDE.md).
# 1.4.x is DuckDB's LTS line; picked over the newer 1.5.x for a batch job that should
# need the least maintenance attention.
analytical = [
    "duckdb==1.4.5",
]
# DEV-ONLY notebook tooling. Never installed in the serving image, never referenced by
# docker-compose.prod.yml, and not a runtime dependency of anything. `duckdb` is repeated
# rather than depending on `analytical` because a notebook wants it for ATTACH-ing the SQLite
# file (the same mechanism analytical/ uses) and the two extras should be independently
# installable. See docker-compose.yml's `notebook` service.
jupyter = [
    "jupyterlab>=4.0",
    "pandas>=2.0",
    "duckdb==1.4.5",
]
# Filing-narrative segmentation (Track 2 Wave A) -- sec-parser splits a 10-K/10-Q's primary
# document into Items (sec/filing_sections.py). Ingest-time only (ingest/section_backfill.py);
# never a dependency of the base install or the live API, same discipline as `analytical`'s
# duckdb. This is the first HTML/NLP dependency this project has ever taken -- see
# sec/filing_sections.py's docstring for why (operator decision, 2026-08-23, reversing the
# stdlib-only default `sec/exhibits.py` set). Pinned exactly: version 0.58.1 is the one the
# Wave A implementation spike (2026-08-23) verified against three real filings -- its
# `Edgar10QParser` has no dedicated 10-K support, and the span-extraction workaround in
# filing_sections.py depends on that specific behavior, not assumed to hold across versions.
#
# `fastembed` (Wave B, added 2026-08-26) computes local sentence embeddings for the no-LLM half
# of Stage 5 classification (risk themes, CAM topics, litigation categories -- see
# docs/ROADMAP_TRACK2.md §8.1). Picked over `sentence-transformers`, deliberately: that library
# pulls in `torch` (500MB-2GB+ CPU wheel); `fastembed` runs on `onnxruntime` alone with small
# quantized models, closer to this project's cost posture even though a real ML dependency is now
# accepted in principle. Same extra as `sec-parser` above (both ingest-only, both narrative-
# pipeline concerns) rather than a third extra. Model name/version are pinned in code, not just
# here -- see `normalize/section_embeddings.py`'s EMBEDDING_MODEL_NAME.
narrative = [
    "sec-parser==0.58.1",
    "fastembed==0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secfin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
