<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearyFi — Sector analytics</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='7' fill='%231c1a16'/%3E%3Crect x='8.5' y='8.5' width='9' height='9' rx='2' fill='%23c0703a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- STYLE_GUIDE §5 load order. V3-P2: this page now loads app.css (it declined to before, which
       forced sectorapp.css to re-declare .plot-chart*/.dist-strip-* — both duplicates are gone) and
       shell.css, so it wears the SAME shell as every other data page. -->
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/sectorapp.css">
</head>
<body class="app">
  <!-- Shell mounts live OUTSIDE #app on purpose: sectorapp.js rewrites #app.innerHTML on every
       state change, so a sidebar inside it would lose its listeners on the first tile click. -->
  <aside class="app-side" id="appSide" aria-label="Primary navigation"></aside>
  <div class="app-scrim" id="appScrim"></div>
  <div class="app-main">
    <header class="app-topbar" id="appTopbar"></header>
    <div id="app"></div>
  </div>

  <!-- vendored (CSP-safe) charting for the drill-down box-whisker tracks -->
  <script src="/static/vendor/d3.min.js"></script>
  <script src="/static/vendor/plot.umd.min.js"></script>
  <!-- suggest.js -> shell.js -> app.js -> page JS (STYLE_GUIDE §5). app.js provides the
       window.ClearyFi.* helpers; shell.js renders the one product shell. -->
  <script src="/static/suggest.js"></script>
  <script src="/static/shell.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/sectorapp.js"></script>
</body>
</html>
