services:
  api:
    # Explicit target: the Dockerfile has an `analytics` stage after this one, and an
    # untargeted build would take the LAST stage -- putting duckdb in the serving image.
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      SEC_USER_AGENT: "${SEC_USER_AGENT:?Set SEC_USER_AGENT, e.g. 'sec-financials-api you@example.com'}"
      SECFIN_DB_PATH: "/app/data/secfin.db"
      SECFIN_BACKUP_DIR: "/app/backups"
      SEC_MAX_RPS: "${SEC_MAX_RPS:-8}"
      SECFIN_ADMIN_SECRET: "${SECFIN_ADMIN_SECRET:-}"
      SECFIN_ANON_RATE_LIMIT_PER_SEC: "${SECFIN_ANON_RATE_LIMIT_PER_SEC:-2.0}"
      # Bulk backfill tuning (ingest/backfill.py) -- SECFIN_BULK_DATA_DIR is deliberately
      # NOT surfaced here, unlike these three: it's a path under the same secfin-data
      # volume as SECFIN_DB_PATH above, so it's fixed like that one rather than
      # user-tunable via .env. These three are plain performance knobs.
      SECFIN_BACKFILL_WORKERS: "${SECFIN_BACKFILL_WORKERS:-0}"
      SECFIN_BACKFILL_BATCH_SIZE: "${SECFIN_BACKFILL_BATCH_SIZE:-5000}"
      SECFIN_BACKFILL_QUEUE_MAXSIZE: "${SECFIN_BACKFILL_QUEUE_MAXSIZE:-50}"
    volumes:
      - secfin-data:/app/data
      # Host bind mount, deliberately separate from the secfin-data named volume above:
      # backups written here (storage/backup.py) land as real files under ./data/backups
      # on the host, so they survive `docker compose down -v` wiping secfin-data.
      - ./data/backups:/app/backups


  # --- analytical batches (opt-in via profile; NEVER started by `docker compose up`) ---
  # Same source, same volume, different image: the `analytics` build target adds duckdb, which
  # the serving image deliberately does not carry. Run one explicitly, e.g.
  #   docker compose --profile analytics run --rm analytics \
  #     python -m secfin.analytical.insider_peer_ratio
  analytics:
    profiles: ["analytics"]
    build:
      context: .
      target: analytics
    environment:
      SEC_USER_AGENT: "${SEC_USER_AGENT:?Set SEC_USER_AGENT, e.g. 'sec-financials-api you@example.com'}"
      SECFIN_DB_PATH: "/app/data/secfin.db"
    volumes:
      - secfin-data:/app/data

  # --- filing-narrative ingest (opt-in via profile; NEVER started by `docker compose up`) ---
  # Same source, same volume, different image: the `narrative` build target adds sec-parser
  # (Track 2 Wave A), which the serving image deliberately does not carry. Run explicitly, e.g.
  #   docker compose --profile narrative run --rm narrative \
  #     python -m secfin.ingest.section_backfill --forms 10-K,10-Q --limit 1
  narrative:
    profiles: ["narrative"]
    build:
      context: .
      target: narrative
    environment:
      SEC_USER_AGENT: "${SEC_USER_AGENT:?Set SEC_USER_AGENT, e.g. 'sec-financials-api you@example.com'}"
      SECFIN_DB_PATH: "/app/data/secfin.db"
    volumes:
      - secfin-data:/app/data

  # --- testing (opt-in via profiles; NOT started by `docker compose up`) ---
  # These bind-mount the repo into the public python image instead of using the prod `api`
  # image, which deliberately ships without tests/ or the [dev] extra. See docs/DEVELOPMENT.md.

  # Unit tests:  docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install -q -e '.[dev]' && pytest -q"

  # e2e app under test: seeds the fixtures into a throwaway DB, then serves (no network needed).
  e2e-app:
    profiles: ["e2e"]
    image: python:3.11-slim
    working_dir: /app
    environment:
      SEC_USER_AGENT: "${SEC_USER_AGENT:-clearyfi-e2e e2e@example.com}"
      SECFIN_DB_PATH: "/app/data/e2e.db"
    volumes:
      - .:/app
    command: >
      bash -c "pip install -q -e . &&
      python scripts/seed_fixture.py &&
      uvicorn secfin.api.main:app --host 0.0.0.0 --port 8000 --log-level warning"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Headless-browser render check (real Chromium). Run with:
  #   docker compose --profile e2e up --abort-on-container-exit --exit-code-from e2e
  # Screenshots land in ./data/e2e-shots (gitignored); exit code is the pass/fail signal.
  e2e:
    profiles: ["e2e"]
    image: ghcr.io/puppeteer/puppeteer:latest
    user: root  # so screenshots are writable to the bind-mounted output dir
    depends_on:
      e2e-app:
        condition: service_healthy
    environment:
      BASE_URL: "http://e2e-app:8000"
      OUT_DIR: "/out"
      # We run as root (to write the bind-mounted output dir), so point Puppeteer at the
      # browser the image installed under pptruser's home rather than root's.
      PUPPETEER_CACHE_DIR: "/home/pptruser/.cache/puppeteer"
    working_dir: /home/pptruser
    volumes:
      - ./scripts/headless_check.js:/home/pptruser/headless_check.js:ro
      - ./data/e2e-shots:/out
    command: node headless_check.js

  # JupyterLab against the local database. DEV ONLY -- see the Dockerfile's `notebook` stage for
  # the three mechanisms that keep it out of production, and tests/test_compose_shape.py for the
  # two of them that are asserted rather than trusted.
  notebook:
    profiles: ["notebook"]
    build:
      context: .
      target: notebook
    ports:
      # 127.0.0.1 ONLY. The `api` service binds 0.0.0.0 because Caddy fronts it in prod; nothing
      # fronts this, it has no auth beyond Jupyter's token, and it holds an open handle to a
      # 59 GB database. It has no business being reachable off the machine.
      - "127.0.0.1:8888:8888"
    environment:
      SECFIN_DB_PATH: "/app/data/secfin.db"
    volumes:
      # READ-ONLY. The API and the batch jobs contend for the single SQLite write lock; a notebook
      # holding a write connection open while you think about the next cell is a real hazard, and
      # `:ro` makes it Docker's problem rather than something to remember.
      - secfin-data:/app/data:ro
      # Notebooks live on the host so they survive the container and can be gitignored.
      - ./notebooks:/app/notebooks
    working_dir: /app/notebooks

  # --- remote development (opt-in via profile; NEVER started by `docker compose up`) ---------
  # A dev container you SSH into, plus the ngrok agent that makes it reachable. Together they
  # let development continue from a laptop with nothing installed on it but an SSH client.
  # Start both with:  docker compose --profile remote up -d
  # Then:             bash deploy/scripts/remote-dev-url.sh   (prints the ssh command)
  # See docs/DEVELOPMENT.md §9.

  devbox:
    profiles: ["remote"]
    # Its OWN Dockerfile, not a stage in the root one -- every stage there is reachable by an
    # untargeted build, and the image that serves production traffic must never acquire a shell
    # toolchain or an SSH daemon. See deploy/devbox/Dockerfile's header.
    build:
      context: .
      dockerfile: deploy/devbox/Dockerfile
    # Survives a host reboot or a Docker daemon restart, which is most of the point of a box you
    # attach to from elsewhere. It does NOT save tmux sessions -- those are process state and die
    # with the container (see docs/DEVELOPMENT.md §9).
    restart: unless-stopped
    ports:
      # 127.0.0.1 ONLY, on the same reasoning as `notebook` above. The remote path is the tunnel,
      # not this mapping; this exists so you can `ssh -p 2222 dev@127.0.0.1` from the host to
      # verify the container without involving ngrok at all.
      - "127.0.0.1:2222:22"
    environment:
      # The vite dev server proxies /v1 here (clearyfi_frontend/vite.config.ts reads this).
      # Docker DNS, so it works without `api` publishing a port.
      CLEARYFI_API: "http://api:8000"
      # Mount points the entrypoint must hand to the `dev` user. Space-separated. These are named
      # volumes layered over the bind-mounted repo, so Docker has no image path to take ownership
      # from and creates them root-owned -- `npm ci` then fails with a permissions error that
      # never mentions ownership. Kept next to the volume list below so the two cannot drift.
      DEVBOX_OWNED_DIRS: "/workspace/clearyfi_frontend/node_modules"
    volumes:
      # The repo itself. Edits made over SSH are edits on the host -- nothing you write is
      # trapped inside the container.
      - .:/workspace
      - devbox-home:/home/dev
      # Container-owned, deliberately NOT the host's node_modules: that tree is ~400 MB of
      # host-built binaries, and .dockerignore already refuses to copy it for the same reason.
      # Run `npm ci` once inside the box to fill this.
      - devbox-node-modules:/workspace/clearyfi_frontend/node_modules
      - devbox-sshkeys:/etc/ssh/keys
      # Whose keys may log in. TWO sources, merged by the entrypoint, because two different
      # machines need in and their keys live in different files:
      #   1. the keys allowed to log into THIS machine -- i.e. the laptop's. Note that
      #      ~/.ssh/id_ed25519.pub would be the wrong file: it authorises this computer.
      #   2. this computer's own key, so `ssh -p 2222 dev@127.0.0.1` works from the host and the
      #      box can be checked without involving ngrok.
      - ${DEVBOX_AUTHORIZED_KEYS:-${HOME}/.ssh/authorized_keys}:/etc/devbox/keys/authorized_keys:ro
      - ${HOME}/.ssh/id_ed25519.pub:/etc/devbox/keys/this-host.pub:ro
      # Editor + tmux config, READ-ONLY, copied into place by the entrypoint on every start (see
      # its comment for why copied and not mounted at the destination). The host stays the source
      # of truth: edit there, restart the box. Plugin DATA is deliberately not here -- the host's
      # ~/.local/share/nvim is 760 MB of host-built artefacts and the box builds its own.
      - ${HOME}/.tmux.conf:/etc/devbox/dotfiles/tmux.conf:ro
      - ${HOME}/.tmux:/etc/devbox/dotfiles/tmux:ro
      - ${HOME}/.config/nvim:/etc/devbox/dotfiles/nvim:ro
      # Read-WRITE, unlike `notebook`: this is a place you run ingest jobs and tests from. That
      # makes it a second writer against the same SQLite lock the API holds -- fine for editing
      # and pytest, worth a thought before starting a backfill while the API serves.
      - secfin-data:/app/data

  # The tunnel. ONE tcp endpoint, to SSH only -- the app is reached by forwarding over that
  # connection (`ssh -L 8000:api:8000`), never by publishing it.
  #
  # Why not an http tunnel straight to `api`: api/auth.py's `_is_first_party_browser` ungates the
  # API for anything sending `Sec-Fetch-Site: same-origin`, which every browser does. A public
  # URL would therefore serve the whole API keyless and rate-limit-exempt to anyone who found it,
  # and spend our SEC request budget doing it. Its own docstring says it is "NOT a security
  # boundary". Over SSH that gate never faces the internet, and ngrok relays ciphertext it
  # cannot read.
  ngrok:
    profiles: ["remote"]
    image: ngrok/ngrok:latest
    # on-failure with a CAP, not `unless-stopped` like devbox. The agent handles transient network
    # loss itself and keeps running; if the PROCESS exits, the cause is fatal and permanent --
    # a bad authtoken, or ERR_NGROK_8013 (TCP endpoints need a card on file even on the free
    # tier). `unless-stopped` turns those into an infinite reconnect loop against ngrok's API,
    # which is both useless and rude. Three tries, then it stays down and the logs say why.
    restart: on-failure:3
    command: ["tcp", "devbox:22", "--config", "/etc/ngrok.yml", "--log", "stdout"]
    environment:
      # Soft default, NOT the `${VAR:?message}` form `api` uses for SEC_USER_AGENT -- and that is
      # not an inconsistency. Compose interpolates EVERY service in the file before it applies
      # `--profile`, so a required variable here would make `docker compose up api` and
      # `--profile test` fail for anyone without an ngrok account. Empty is caught at run time by
      # ngrok itself, which prints a clear "requires a verified account and authtoken".
      # tests/test_compose_shape.py pins this.
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:-}"
    volumes:
      # One setting: web_addr. There is no --web-addr FLAG on `ngrok tcp` (3.39.8) -- passing one
      # makes the agent exit on startup and compose restart-loops it. No secret in the file; the
      # authtoken comes from the environment above.
      - ./deploy/ngrok/ngrok.yml:/etc/ngrok.yml:ro
    ports:
      # The local inspector, and how remote-dev-url.sh learns the assigned address. Loopback on
      # the HOST; the 0.0.0.0 in ngrok.yml is the container's own interface, which the mapping
      # would otherwise be unable to reach.
      - "127.0.0.1:4040:4040"
    depends_on:
      - devbox


volumes:
  secfin-data:
  # devbox-only, all three. Separate from secfin-data so `docker compose down -v` reasoning
  # stays per-concern, and so removing the dev box never touches the database.
  devbox-home:
  devbox-node-modules:
  devbox-sshkeys:
